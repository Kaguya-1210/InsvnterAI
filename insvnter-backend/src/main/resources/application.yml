spring:
  application:
    name: InsvnterAI
  profiles:
    active: dev

  # MariaDB
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/insvnter_ai?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}

    # MongoDB
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/insvnter_ai}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# JWT
app:
  jwt:
    secret: ${JWT_SECRET:InsvnterAI_Default_Secret_Key_Change_In_Production_2024!}
    expiration-ms: ${JWT_EXPIRATION:86400000}

# Kaptcha
kaptcha:
  border: false
  text-producer-char-length: 4
  text-producer-font-size: 32
  image-width: 120
  image-height: 40
