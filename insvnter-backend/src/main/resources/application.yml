spring:
  application:
    name: InsvnterAI
  profiles:
    active: dev

  # MySQL (compatible with MariaDB)
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:insvnter_ai}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}

    # MongoDB
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/insvnter_ai}

  # Mail
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# JWT
app:
  jwt:
    secret: ${JWT_SECRET:InsvnterAI_Default_Secret_Key_Change_In_Production_2024!}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  mail:
    from: ${MAIL_FROM:noreply@insvnter.ai}
    name: ${MAIL_FROM_NAME:InsvnterAI}

# Kaptcha
kaptcha:
  border: "no"
  text-producer-char-length: 4
  text-producer-font-size: 32
  image-width: 120
  image-height: 40
